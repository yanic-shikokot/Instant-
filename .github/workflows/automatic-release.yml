name: Automatic Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare next release version
        run: |
          git fetch --tags --force
          node scripts/prepare-release-version.cjs

      - name: Commit automatic version bump
        run: |
          if ! git diff --quiet -- package.json index.html; then
            version=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json index.html
            git commit -m "release: bump FieldInspect Pro to $version"
            git push origin HEAD:main
          fi

      - name: Start Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-windows.yml --repo "${{ github.repository }}" --ref main
