name: Release Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare release version
        shell: pwsh
        run: |
          git fetch --tags --force
          node scripts/prepare-release-version.cjs

          $packageVersion = node -p "require('./package.json').version"
          $tag = "v$packageVersion"

          if (-not (git diff --quiet -- package.json index.html)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json index.html
            git commit -m "release: bump FieldInspect Pro to $packageVersion"
            git push origin HEAD:main
          }

          "FIELDINSPECT_RELEASE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FIELDINSPECT_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Preparing FieldInspect Pro $tag"

      - name: Install dependencies
        run: npm install

      - name: Source capitalization audit
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File | Where-Object {
            $_.Extension -in '.js','.cjs','.jsx','.ts','.tsx','.html','.json' -and
            $_.FullName -notmatch '\\(node_modules|dist|release)\\'
          }
          $bad = $files | Select-String -CaseSensitive -Pattern '@Supabase/supabase-js|@supabase/Supabase-js|@SUPABASE/supabase-js|@SUPABASE/SUPABASE-JS'
          if ($bad) { $bad | Format-List; throw "SOURCE AUDIT FAILURE: invalid Supabase package capitalization found." }

      - name: JSON syntax audit
        shell: pwsh
        run: |
          $jsonFiles = Get-ChildItem -Path . -Recurse -File -Filter *.json | Where-Object {
            $_.FullName -notmatch '\\(node_modules|dist|release)\\'
          }
          foreach ($file in $jsonFiles) {
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" -- "$($file.FullName)"
          }

      - name: Vite configuration audit
        shell: pwsh
        run: |
          $viteConfigs = @(Get-ChildItem -Path . -File -Filter 'vite.config.*' -ErrorAction SilentlyContinue)
          if ($viteConfigs.Count -ne 1 -or $viteConfigs[0].Name -ne 'vite.config.js') { throw "VITE CONFIG AUDIT FAILURE: expected exactly one vite.config.js." }

      - name: Static asset audit
        shell: pwsh
        run: |
          if (-not (Test-Path 'public/auth-config.js')) { throw "STATIC ASSET AUDIT FAILURE: public/auth-config.js is missing." }

      - name: Electron syntax audit
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: TypeScript diagnostics
        run: npm run lint

      - name: Build Windows installer
        run: npm run dist

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $version = $env:FIELDINSPECT_RELEASE_VERSION
          $installer = Get-ChildItem "release" -Filter "FieldInspect-Pro-Setup-$version-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "release" -Filter "FieldInspect-Pro-Setup-$version-*.exe.blockmap" | Select-Object -First 1
          if (-not $installer) { throw "BUILD FAILURE: Windows installer is missing." }
          if (-not $blockmap) { throw "BUILD FAILURE: Windows blockmap is missing." }
          if ($installer.Length -lt 10MB) { throw "BUILD FAILURE: installer is unexpectedly small." }

          $html = Get-Content "dist/index.html" -Raw
          if ($html -notmatch ('name="application-version"[^>]*content="' + [regex]::Escape($version) + '"')) { throw "SMOKE TEST FAILURE: application version marker is stale." }
          if ($html -notmatch ('data-fieldinspect-version="' + [regex]::Escape($version) + '"')) { throw "SMOKE TEST FAILURE: renderer version marker is stale." }

          $main = Get-Content "electron/main.cjs" -Raw
          if ($main -notmatch 'autoInstallOnAppQuit\s*=\s*true') { throw "SMOKE TEST FAILURE: automatic installation on app quit is disabled." }

      - name: Generate update metadata
        shell: pwsh
        run: |
          $version = $env:FIELDINSPECT_RELEASE_VERSION
          $installer = Get-ChildItem "release" -Filter "FieldInspect-Pro-Setup-$version-*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA512).Hash
          $bytes = for ($i = 0; $i -lt $hash.Length; $i += 2) { [Convert]::ToByte($hash.Substring($i, 2), 16) }
          $sha512 = [Convert]::ToBase64String($bytes)
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          @(
            "version: $version"
            "files:"
            "  - url: $($installer.Name)"
            "    sha512: $sha512"
            "    size: $($installer.Length)"
            "path: $($installer.Name)"
            "sha512: $sha512"
            "releaseDate: $date"
          ) | Set-Content "release/latest.yml" -Encoding utf8

      - name: Create release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:FIELDINSPECT_RELEASE_TAG
          git fetch --tags --force
          $existing = git tag --list $tag
          if ($existing) {
            $tagSha = (git rev-list -n 1 $tag).Trim()
            $headSha = (git rev-parse HEAD).Trim()
            if ($tagSha -ne $headSha) { throw "RELEASE SAFETY FAILURE: $tag already points to $tagSha while HEAD is $headSha." }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "FieldInspect Pro $env:FIELDINSPECT_RELEASE_VERSION"
            git push origin $tag
          }

      - name: Create or publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:FIELDINSPECT_RELEASE_TAG
          $version = $env:FIELDINSPECT_RELEASE_VERSION
          $installer = Get-ChildItem "release" -Filter "FieldInspect-Pro-Setup-$version-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "release" -Filter "FieldInspect-Pro-Setup-$version-*.exe.blockmap" | Select-Object -First 1
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --verify-tag --title "FieldInspect Pro $version" --generate-notes --latest
          } else {
            gh release edit $tag --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
          }
          gh release upload $tag "$($installer.FullName)" "$($blockmap.FullName)" "release/latest.yml" --repo "${{ github.repository }}" --clobber

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:FIELDINSPECT_RELEASE_TAG
          $version = $env:FIELDINSPECT_RELEASE_VERSION
          $installerName = "FieldInspect-Pro-Setup-$version-x64.exe"
          $release = gh release view $tag --repo "${{ github.repository }}" --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.isDraft) { throw "PUBLISH FAILURE: release is still a draft." }
          if ($release.isPrerelease) { throw "PUBLISH FAILURE: release is marked prerelease." }
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names -notcontains $installerName) { throw "PUBLISH FAILURE: installer missing." }
          if ($names -notcontains "$installerName.blockmap") { throw "PUBLISH FAILURE: blockmap missing." }
          if ($names -notcontains "latest.yml") { throw "PUBLISH FAILURE: latest.yml missing." }
          Remove-Item -Recurse -Force "verify-release" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory "verify-release" | Out-Null
          gh release download $tag --repo "${{ github.repository }}" --pattern "$installerName" --pattern "$installerName.blockmap" --pattern "latest.yml" --dir "verify-release" --clobber
          $downloaded = Get-Item "verify-release/$installerName"
          $hash = (Get-FileHash $downloaded.FullName -Algorithm SHA512).Hash
          $bytes = for ($i = 0; $i -lt $hash.Length; $i += 2) { [Convert]::ToByte($hash.Substring($i, 2), 16) }
          $sha512 = [Convert]::ToBase64String($bytes)
          $metadata = Get-Content "verify-release/latest.yml" -Raw
          if ($metadata -notmatch [regex]::Escape($sha512)) { throw "PUBLISH FAILURE: downloaded installer does not match latest.yml." }
          Write-Host "PUBLISHED RELEASE VERIFICATION PASSED for FieldInspect Pro $version."
