name: Release Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate package version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -and $tagVersion -ne $packageVersion) {
            throw "Git tag v$packageVersion is required, but received ${{ github.ref_name }}"
          }

      - name: Build and publish Windows release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release" -Filter "FieldInspect-Pro-Setup-*.exe" | Select-Object -First 1
          $metadata = Get-ChildItem "release" -Filter "latest.yml" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          if (-not $metadata) { throw "latest.yml was not produced; automatic updates cannot work." }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Update metadata: $($metadata.FullName)"
