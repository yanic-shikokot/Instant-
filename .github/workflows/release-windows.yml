name: Release Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tag = "v$packageVersion"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -ne $tag) {
              throw "Git tag ${{ github.ref_name }} does not match package version $packageVersion."
            }
          } else {
            git fetch --tags --force
            $existing = git tag --list $tag
            if (-not $existing) {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a $tag -m "FieldInspect Pro $packageVersion"
              git push origin $tag
            }
          }
          Write-Host "Release tag: $tag"

      - name: Build and publish Windows release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $installer = Get-ChildItem "release" -Filter "FieldInspect-Pro-Setup-$packageVersion-*.exe" | Select-Object -First 1
          $metadata = Get-ChildItem "release" -Filter "latest.yml" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer for version $packageVersion was not produced." }
          if (-not $metadata) { throw "latest.yml was not produced; automatic updates cannot work." }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Update metadata: $($metadata.FullName)"

      - name: Verify published GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          gh release view "v$packageVersion" --repo "${{ github.repository }}" --json isDraft,isPrerelease,tagName
          $draft = gh release view "v$packageVersion" --repo "${{ github.repository }}" --json isDraft --jq ".isDraft"
          if ($draft -eq "true") { throw "GitHub release v$packageVersion is still a draft; electron-updater cannot see draft releases." }
