name: Build Windows Installer

concurrency:
  group: fieldinspect-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Static source audit
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.js,*.cjs,*.jsx,*.ts,*.tsx,*.html,*.json | Where-Object { $_.FullName -notmatch '\\(node_modules|dist|release)\\' }
          $bad = $files | Select-String -CaseSensitive -Pattern '@Supabase/supabase-js|@supabase/Supabase-js|@SUPABASE/supabase-js|@SUPABASE/SUPABASE-JS'
          if ($bad) { $bad | Format-List; throw "SOURCE AUDIT FAILURE: invalid Supabase package capitalization found." }
          $jsonFiles = $files | Where-Object { $_.Extension -eq '.json' }
          foreach ($file in $jsonFiles) { Get-Content $file.FullName -Raw | ConvertFrom-Json | Out-Null }
          $viteConfigs = @(Get-ChildItem -File 'vite.config.*' -ErrorAction SilentlyContinue)
          if ($viteConfigs.Count -ne 1 -or $viteConfigs[0].Name -ne 'vite.config.js') { throw "SOURCE AUDIT FAILURE: expected exactly one vite.config.js." }
          if (-not (Test-Path 'public/auth-config.js')) { throw "SOURCE AUDIT FAILURE: public/auth-config.js is missing." }
          foreach ($file in ($files | Where-Object { $_.Extension -in '.js','.cjs' })) { node --check $file.FullName }
          Write-Host "STATIC SOURCE AUDIT PASSED."

      - name: TypeScript diagnostics
        run: npm run lint

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FieldInspect-Pro-Windows
          path: release/FieldInspect-Pro-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
